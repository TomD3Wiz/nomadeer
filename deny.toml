[advisories]
version = 2
yanked = "deny"
# Candle currently depends on zip 8.6 for optional NPZ/PyTorch readers. Nomadeer only
# loads checksum-verified GGUF files and never calls zip extraction APIs, so these
# extraction-only advisories are not reachable in the application.
ignore = [
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
unmaintained = "none"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "OFL-1.1",
  "Unicode-3.0",
  "Ubuntu-font-1.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
