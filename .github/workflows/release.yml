name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # AVX2/FMA build: Umbra briefings run about 3x faster.
          - variant: optimized
            rustflags: "-C target-cpu=x86-64-v3"
          # Baseline x86-64 build for CPUs without AVX2.
          - variant: compatible
            rustflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxxf86vm-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          name="nomadeer-${version}-linux-x86_64-${{ matrix.variant }}"
          mkdir -p "dist/${name}"
          cp target/release/nomadeer README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256

  windows-build:
    name: Build Windows ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          # AVX2/FMA build: Umbra briefings run about 3x faster.
          - variant: optimized
            rustflags: "-C target-cpu=x86-64-v3"
          # Baseline x86-64 build for CPUs without AVX2.
          - variant: compatible
            rustflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.variant }}
          workspaces: ". -> target/${{ matrix.variant }}"

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target-dir target/${{ matrix.variant }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ matrix.variant }}
          path: target/${{ matrix.variant }}/release/nomadeer.exe
          if-no-files-found: error
          retention-days: 1

  windows-package:
    name: Package Windows installer
    needs: windows-build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: windows-exe-*
          path: target/windows

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @("$env:ProgramFiles\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not ($iscc | Where-Object { Test-Path $_ })) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer and portable zip
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          ./packaging/windows/package.ps1 -Version $version `
            -OptimizedExe target/windows/windows-exe-optimized/nomadeer.exe `
            -CompatibleExe target/windows/windows-exe-compatible/nomadeer.exe `
            -OutDir dist
          "name=nomadeer-$version-windows-x86_64" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, windows-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Release files only, not the intermediate Windows binaries.
          pattern: nomadeer-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "Nomadeer ${GITHUB_REF_NAME}"
          --generate-notes
          dist/*
