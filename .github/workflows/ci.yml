name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxxf86vm-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # rustfmt.toml uses nightly-only options; keep in step with RUSTFMT_TOOLCHAIN
      # in the Makefile.
      - name: Install rustfmt (pinned nightly)
        run: rustup toolchain install nightly-2026-10-01 --profile minimal --component rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check release version files agree
        run: python3 tools/release.py check

      - name: Check the Windows installer's Umbra downloads can be generated
        run: python3 tools/release.py inno-defines

      - name: Check formatting
        run: cargo +nightly-2026-10-01 fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build release binary
        run: cargo build --release --all-features

  windows:
    name: Windows build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features --locked

      - name: Run tests
        run: cargo test --all-features --locked

  security:
    name: Audit and dependency policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install audit tools
        run: cargo install --locked cargo-audit cargo-deny

      - name: Run cargo-audit
        # Candle's zip dependency is used for optional NPZ/PyTorch readers. Nomadeer
        # only loads checksum-verified GGUF files and never invokes zip extraction.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0367
          --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369

      - name: Run cargo-deny
        run: cargo deny check
